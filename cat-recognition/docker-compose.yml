services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
      - ./backend/models:/app/models
    environment:
      PYTHONUNBUFFERED: "1"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
